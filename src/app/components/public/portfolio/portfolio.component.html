<div class="container">
  <h2>📸 Portfolio de {{ user?.name }}</h2>

  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <!-- Section Images et Vidéos Publiques -->
  <h3>🌟 Images et vidéos publiques</h3>
  <div class="media-grid">
    <div *ngFor="let image of publicImages" class="media-item">
      <a [routerLink]="['/resource', 'image', image.id]">
        <img [src]="'http://localhost:8089/api/images/image/' + image.path" [alt]="image.title" />
        <p>{{ image.title }}</p>
      </a>
    </div>

    <div *ngFor="let video of publicVideos" class="media-item">
      <a [routerLink]="['/resource', 'video', video.id]">
        <app-video-player 
          [videoSrc]="video.path" 
          [videoTitle]="video.title">
        </app-video-player>
      </a>
    </div>
  </div>

  <!-- Section Images et Vidéos Privées -->
  <div *ngIf="isLoggedIn">
    <h3>🔒 Images et vidéos privées</h3>
    <div class="media-grid">
      <div *ngFor="let image of privateImages" class="media-item">
        <a [routerLink]="['/resource', 'image', image.id]">
          <img [src]="'http://localhost:8089/api/images/image/' + image.path" [alt]="image.title" />
          <p>{{ image.title }}</p>
        </a>
      </div>

      <div *ngFor="let video of privateVideos" class="media-item">
        <a [routerLink]="['/resource', 'video', video.id]">
          <app-video-player 
            [videoSrc]="video.path" 
            [videoTitle]="video.title">
          </app-video-player>
        </a>
      </div>
    </div>
  </div>
</div>
