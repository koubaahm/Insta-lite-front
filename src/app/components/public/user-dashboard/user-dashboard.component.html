<h1>Médias disponibles</h1>

<!-- Images publiques -->
<section>
  <h2>Images publiques</h2>
  <div class="media-grid">
    <div *ngFor="let image of publicImages" class="media-item">
      <img [src]="image.path" [alt]="image.title" />
      <p>{{ image.title }}</p>
    </div>
  </div>
</section>

<!-- Vidéos publiques -->
<section>
  <h2>Vidéos publiques</h2>
  <div class="media-grid">
    <div *ngFor="let video of publicVideos" class="media-item">
      <video controls>
        <source [src]="video.path" type="video/mp4" />
        Votre navigateur ne supporte pas la lecture des vidéos.
      </video>
      <p>{{ video.title }}</p>
    </div>
  </div>
</section>

<!-- Contenu privé (si connecté) -->
<section *ngIf="isLoggedIn">
  <h2>Images privées</h2>
  <div class="media-grid">
    <div *ngFor="let image of privateImages" class="media-item">
      <img [src]="image.path" [alt]="image.title" />
      <p>{{ image.title }}</p>
    </div>
  </div>

  <h2>Vidéos privées</h2>
  <div class="media-grid">
    <div *ngFor="let video of privateVideos" class="media-item">
      <video controls>
        <source [src]="video.path" type="video/mp4" />
        Votre navigateur ne supporte pas la lecture des vidéos.
      </video>
      <p>{{ video.title }}</p>
    </div>
  </div>
</section>

<!-- Message pour les utilisateurs non connectés -->
<section *ngIf="!isLoggedIn">
  <p>Connectez-vous pour accéder aux contenus privés.</p>
</section>
