<div class="container">
  <h2>👥 Gestion des utilisateurs</h2>

  <!-- Bouton pour afficher/masquer le formulaire -->
  <button class="add-user-btn" (click)="toggleForm()">
    {{ showForm ? 'Annuler' : 'Ajouter un utilisateur' }}
  </button>

  <!-- Formulaire affiché au-dessus du tableau -->
  <div *ngIf="showForm" class="form-container">
    <h3>{{ isEditing ? 'Modifier un utilisateur' : 'Ajouter un utilisateur' }}</h3>
    <form [formGroup]="userForm" (ngSubmit)="submitForm()" class="user-form">
      <div class="form-group">
        <label for="name">Nom :</label>
        <input id="name" type="text" formControlName="name" class="form-control" placeholder="Entrez le nom" />
      </div>
      <div class="form-group">
        <label for="email">Email :</label>
        <input id="email" type="email" formControlName="email" class="form-control" placeholder="Entrez l'email" />
      </div>
      <div class="form-group">
        <label for="role">Rôle :</label>
        <select id="role" formControlName="role" class="form-control">
          <option value="USER">Utilisateur</option>
          <option value="ADMIN">Administrateur</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe :</label>
        <input id="password" type="password" formControlName="password" class="form-control" placeholder="Entrez le mot de passe" />
      </div>
      <button type="submit" class="submit-btn">{{ isEditing ? 'Mettre à jour' : 'Créer' }}</button>
    </form>
  </div>

  <!-- Liste des utilisateurs -->
  <h3>📋 Liste des utilisateurs</h3>
  <div class="table-container">
    <table class="user-table">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Email</th>
          <th>Rôle</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>
            <button class="edit-btn" (click)="prepareEdit(user)">Modifier</button>
            <button class="delete-btn" (click)="deleteUser(user.id)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
